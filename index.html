<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>

  <div class="container">

    <!-- ===== SECTION A: GREETING & CLOCK ===== -->
    <section class="card greeting-card">
      <div class="greeting-top">
        <div>
          <p id="greeting-text" class="greeting-text">Selamat Datang</p>
          <h1 id="clock" class="clock">00:00:00</h1>
          <p id="date-text" class="date-text"></p>
        </div>
      </div>
      <div class="name-row">
        <span id="greeting-name" class="greeting-name"></span>
        <button id="edit-name-btn" class="btn-icon" title="Edit nama">✏️</button>
      </div>
      <div id="name-form" class="name-form hidden">
        <input type="text" id="name-input" class="input" placeholder="Masukkan nama panggilan…" maxlength="30" />
        <button id="save-name-btn" class="btn btn-primary">Simpan</button>
      </div>
    </section>

    <!-- ===== SECTION B: FOCUS TIMER ===== -->
    <section class="card timer-card">
      <h2 class="section-title">⏱ Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-pause" class="btn btn-secondary" disabled>⏸ Pause</button>
        <button id="timer-reset" class="btn btn-outline">↺ Reset</button>
      </div>
    </section>

    <!-- ===== SECTION C: TO-DO LIST ===== -->
    <section class="card todo-card">
      <h2 class="section-title">✅ To-Do List</h2>
      <div id="todo-alert" class="alert hidden"></div>
      <form id="todo-form" class="input-row">
        <input type="text" id="todo-input" class="input" placeholder="Tambah tugas baru…" maxlength="100" />
        <button type="submit" class="btn btn-primary">Tambah</button>
      </form>
      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- ===== SECTION D: QUICK LINKS ===== -->
    <section class="card links-card">
      <h2 class="section-title">🔗 Quick Links</h2>
      <form id="link-form" class="link-form">
        <input type="text" id="link-name" class="input" placeholder="Nama situs…" maxlength="30" />
        <input type="url" id="link-url" class="input" placeholder="https://…" />
        <button type="submit" class="btn btn-primary">Tambah</button>
      </form>
      <div id="links-list" class="links-list"></div>
    </section>

  </div>

  <!-- Edit Todo Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Edit Tugas</h3>
      <input type="text" id="edit-input" class="input" maxlength="100" />
      <div class="modal-actions">
        <button id="edit-save-btn" class="btn btn-primary">Simpan</button>
        <button id="edit-cancel-btn" class="btn btn-outline">Batal</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
